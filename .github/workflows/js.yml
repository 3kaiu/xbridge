name: JS SDK (xbridge-js)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/xbridge-js/**'
      - '.github/workflows/js.yml'
  pull_request:
    paths:
      - 'packages/xbridge-js/**'
      - '.github/workflows/js.yml'

defaults:
  run:
    working-directory: packages/xbridge-js

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/xbridge-js/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # 关键门禁：运行生产测试。测试 import 自 `dist/`（构建产物），因此必须
      # 在 build 之后执行。此前测试从未被 CI 运行，改 src 忘 build 会静默
      # 发布与 src 漂移的旧 dist，且无任何运行时测试兜底。
      - run: npm test
      - run: npm pack --dry-run

      - uses: actions/upload-artifact@v4
        with:
          name: xbridge-js-dist
          path: packages/xbridge-js/dist/
